apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vsphere-passthrough-node-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vsphere-passthrough-node-controller.labels" . | nindent 4 }}
data:
  POLL_INTERVAL_SECONDS: {{ .Values.config.pollIntervalSeconds | quote }}
  DRAIN_TIMEOUT_SECONDS: {{ .Values.config.drainTimeoutSeconds | quote }}
  GUEST_SHUTDOWN_TIMEOUT_SECONDS: {{ .Values.config.guestShutdownTimeoutSeconds | quote }}
  POWER_ON_TIMEOUT_SECONDS: {{ .Values.config.powerOnTimeoutSeconds | quote }}
  MAX_CONCURRENT_DRAINS: {{ .Values.config.maxConcurrentDrains | quote }}
  GPU_NODE_LABEL: {{ .Values.config.gpuNodeLabel | quote }}
  DRY_RUN: {{ .Values.config.dryRun | quote }}
  {{- if .Values.vcenter.caBundle.configMapName }}
  VCENTER_CA_BUNDLE: {{ printf "%s/%s" .Values.vcenter.caBundle.mountPath .Values.vcenter.caBundle.key | quote }}
  {{- else if .Values.vcenter.tlsVerify }}
  VCENTER_TLS_VERIFY: "true"
  {{- end }}
