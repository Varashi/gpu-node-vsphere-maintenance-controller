{{- if and (not .Values.vcenter.existingSecret) .Values.vcenter.host }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpu-node-vsphere-maintenance-controller.vcenterSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-node-vsphere-maintenance-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  VCENTER_HOST: {{ .Values.vcenter.host | quote }}
  VCENTER_USER: {{ .Values.vcenter.user | quote }}
  VCENTER_PASSWORD: {{ .Values.vcenter.password | quote }}
{{- end }}
