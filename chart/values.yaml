# Default values for vsphere-passthrough-node-controller.

image:
  repository: ghcr.io/varashi/vsphere-passthrough-node-controller
  # -- Overrides the image tag (defaults to Chart.appVersion)
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Only one replica is supported (no leader election); Recreate strategy
# guarantees the old pod fully terminates before the new one starts.
replicaCount: 1
strategy:
  type: Recreate

# vCenter connection.
# Either set `existingSecret` to the name of a Secret you manage yourself
# (for example, one rendered by ExternalSecretsOperator / ESO) containing
# VCENTER_HOST, VCENTER_USER, VCENTER_PASSWORD — or populate `host`, `user`,
# `password` below and the chart will render a plain Secret for you.
vcenter:
  existingSecret: ""
  host: ""
  user: ""
  password: ""

  # Optional: path inside the container to a CA bundle for vCenter TLS
  # verification. Set `caBundle.configMapName` to a ConfigMap you have
  # created that contains the CA (keyed by `caBundle.key`). When set, the
  # chart mounts it at `caBundle.mountPath` and exports VCENTER_CA_BUNDLE.
  # Use this for self-signed certs or a private/self-hosted CA.
  caBundle:
    configMapName: ""
    key: ca.pem
    mountPath: /etc/ssl/vcenter-ca

  # Set to true when the vCenter certificate chains to a public CA already
  # in the container's system trust store (e.g. Let's Encrypt, DigiCert).
  # Ignored when `caBundle.configMapName` is set. Leave false to keep TLS
  # verification disabled.
  tlsVerify: false

# Controller tunables — rendered into the controller-config ConfigMap.
config:
  pollIntervalSeconds: 30
  drainTimeoutSeconds: 600
  guestShutdownTimeoutSeconds: 120
  powerOnTimeoutSeconds: 300
  maxConcurrentDrains: 1
  gpuNodeLabel: "intel.feature.node.kubernetes.io/gpu=true"
  dryRun: false

# Crash-fence controller — a SEPARATE Deployment (own RBAC + kill switch) that
# shares this image. Applies the `node.kubernetes.io/out-of-service` taint to a
# GPU node confirmed dead by BOTH k8s (NotReady) and vCenter (VM
# connectionState disconnected/inaccessible/orphaned), sustained graceSeconds,
# so RWO volumes force-detach and stateful pods reschedule; removes it on
# recovery (VM connected + node Ready). Disjoint from maintenance (which keys
# off maintenance-mode tasks and leaves a clean power-off 'connected'), so the
# two never collide. Power-on stays with vSphere HA.
#
# OFF by default — fencing is the most destructive action in the cluster (a
# mis-fire force-detaches a live/partitioned node's volume → corruption).
# Enable explicitly once you trust the signal.
fence:
  enabled: false
  pollSeconds: 20
  graceSeconds: 60
  dryRun: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Default keeps the controller off GPU workers — otherwise it would
# drain itself. Override to `{}` to disable.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: intel.feature.node.kubernetes.io/gpu
              operator: DoesNotExist

nodeSelector: {}
tolerations: []
priorityClassName: ""

# Extra environment variables merged into the container env list.
extraEnv: []
# - name: FOO
#   value: bar

# Extra volumes / volumeMounts for unusual cases (additional CA chains, etc).
extraVolumes: []
extraVolumeMounts: []
